<!doctype html><html lang="vi"><meta charset="utf-8"><title>Timeline form isolated tests</title>
<form id="tripForm"></form><pre id="result">RUNNING</pre>
<script>
// Fixture DOM only; no PHP, database, real network searches or form submission.
const form = document.getElementById('tripForm');
const inputIds = ['tripDays','departureAt','returnAt','participantCount','tripBudget','activityStartTime','activityEndTime','activityName','activityPlace','activityLocationCatalogId','activityCost','activityDescription','activityNotes','activityMenu','activityAmenities','currentDayDescInput','activitiesJson','deletedActivityIds','coverImageQuery','coverSelectedUrl','coverSelectedSource','coverSelectedSourceUrl','coverSelectedAttribution','coverSelectedLicense','coverSelectedLicenseUrl'];
for(const id of inputIds){const e=document.createElement('input');e.id=id;form.append(e);}
for(const id of ['activityList','currentDayTotal','dayBadge','dayDescLabel','overnightHint','locationSearchStatus','locationSearchResults','activityLocationDetails','coverImageStatus','coverImageResults','previewPlaceholder','tripDateStatus','tripCalculatedTotal','tripAveragePerPerson','targetBudgetValue','budgetComparison','budgetByCategory','budgetByDay','dayDescInputsContainer']){const e=document.createElement('div');e.id=id;form.append(e);}
for(const id of ['btnAddActivity','dayPlus','dayMinus','btnSearchCatalog','btnSearchExternal','btnSearchCoverImage']){const e=document.createElement('button');e.id=id;e.type='button';form.append(e);}
for(const [id,options] of [['activityCategory',['sightseeing','food','transport','lodging','rest','free_time','other']],['activityCostScope',['fixed','per_person','']]]){const e=document.createElement('select');e.id=id;for(const v of options)e.add(new Option(v,v));form.append(e);}
const overnight=document.createElement('input');overnight.id='activityOvernight';overnight.type='checkbox';form.append(overnight);
const upload=document.createElement('input');upload.id='coverInput';upload.type='file';form.append(upload);
const $=id=>document.getElementById(id);
$('tripDays').value=2;$('departureAt').value='2026-10-24T00:00';$('returnAt').value='2026-10-25T23:59';$('participantCount').value=3;$('tripBudget').value='0.30';
window.tripTimelineInitialActivities={day_1:[{id:1,title:'Free',location:'Manual',cost:0,cost_scope:'fixed',category:'food'},{id:2,title:'Unknown',location:'Manual',cost:null,cost_scope:'fixed',category:'food'}],day_2:[{title:'Decimal A',location:'Manual',cost:'0.10',cost_scope:'fixed',category:'food'},{title:'Decimal B',location:'Manual',cost:'0.20',cost_scope:'fixed',category:'food'}]};
const alerts=[];window.alert=message=>alerts.push(message);
const pending=[];window.fetch=(url,options)=>new Promise(resolve=>pending.push({url,options,resolve}));
</script><script src="../assets/pages/trip-timeline-form.js"></script><script>
(async()=>{let checks=0;const check=(v,m)=>{checks++;if(!v)throw Error(m);};const flush=()=>new Promise(r=>setTimeout(r,0));const click=id=>$(id).click();
try{
 check($('activityList').textContent.includes('Chưa xác định chi phí'),'Unknown price is not displayed as free');
 $('activityList').querySelector('[data-edit="0"]').click();check($('activityCost').value==='0','Numeric zero retained when editing');click('btnAddActivity');
 $('activityName').value='Blank';$('activityPlace').value='Manual';$('activityCost').value='';click('btnAddActivity');check(alerts.at(-1).includes('nhập chi phí'),'Blank cost rejected');
 $('activityCost').value='0';click('btnAddActivity');check($('activityList').querySelectorAll('[data-edit]').length===3,'Explicit free activity accepted');
 $('activityList').querySelector('[data-remove="1"]').click();check(!$('tripCalculatedTotal').textContent.includes('≥'),'Removing unknown cost makes summary complete');
 check($('budgetComparison').textContent.includes('còn lại') && !$('budgetComparison').className.includes('text-danger'),'0.10 + 0.20 does not falsely exceed 0.30');
 check($('tripAveragePerPerson').textContent.includes('0,1'),'Per-person decimal average');
 $('activityPlace').value='Old';$('activityPlace').dispatchEvent(new Event('input'));click('btnSearchCatalog');
 $('activityPlace').value='New';$('activityPlace').dispatchEvent(new Event('input'));click('btnSearchCatalog');
 const record={id:7,name:'New place',latitude:'11.5',longitude:'107.5',location_source:'osm',location_source_ref:'node:7'};
 pending[1].resolve({ok:true,status:200,text:async()=>JSON.stringify({ok:true,source:'mysql',results:[record]})});await flush();
 check($('locationSearchResults').textContent.includes('New place'),'Latest search rendered');
 pending[0].resolve({ok:true,status:200,text:async()=>JSON.stringify({ok:true,source:'mysql',results:[{id:8,name:'Old place'}]})});await flush();
 check(!$('locationSearchResults').textContent.includes('Old place'),'Stale search ignored');
 $('locationSearchResults').querySelector('[data-location-result]').click();
 check($('activityLocationDetails').textContent.includes('11.5') && $('activityLocationDetails').textContent.includes('node:7'),'Actual catalog coordinates/source visible');
 $('activityName').value='Catalog choice';$('activityCost').value='10';$('activityCostScope').value='per_person';click('btnAddActivity');
 check($('tripCalculatedTotal').textContent.includes('30,3'),'Per-person cost multiplied once');
 check($('budgetComparison').className.includes('text-danger') && $('budgetComparison').textContent.includes('Vượt ngân sách'),'Overspending warning uses group total');
 $('activityList').querySelector('[data-edit="2"]').click();check($('activityLocationDetails').textContent.includes('11.5'),'Catalog coordinates survive add then edit before save');
 $('activityName').value='Renamed activity';click('btnAddActivity');
 $('tripForm').dispatchEvent(new Event('submit',{cancelable:true}));const payload=JSON.parse($('activitiesJson').value);
 check(payload.day_1[2].latitude==='11.5' && payload.day_1[2].location_source_ref==='node:7','Canonical selection metadata reaches payload');
 $('activityList').querySelector('[data-up="2"]').click();$('tripForm').dispatchEvent(new Event('submit',{cancelable:true}));
 check(JSON.parse($('activitiesJson').value).day_1[1].title==='Renamed activity','Reorder is serialized without losing the activity');
 $('activityList').querySelector('[data-down="1"]').click();
 $('activityList').querySelector('[data-edit="2"]').click();$('activityPlace').value='Another manual place';$('activityPlace').dispatchEvent(new Event('input'));click('btnAddActivity');
 $('tripForm').dispatchEvent(new Event('submit',{cancelable:true}));const manual=JSON.parse($('activitiesJson').value).day_1[2];check(manual.latitude===null && manual.longitude===null && manual.location_catalog_id==='','Manual name change clears old coordinates');
 while($('activityList').querySelector('[data-remove="0"]'))$('activityList').querySelector('[data-remove="0"]').click();click('dayPlus');while($('activityList').querySelector('[data-remove="0"]'))$('activityList').querySelector('[data-remove="0"]').click();
 check($('tripAveragePerPerson').textContent==='Chưa đủ dữ liệu' && $('budgetComparison').textContent.includes('Chưa có hoạt động'),'Empty trip is distinct from a fully free trip');
 document.getElementById('result').textContent='PASS '+checks+' browser DOM checks';
}catch(e){document.getElementById('result').textContent='FAIL '+e.message;}
})();
</script></html>
